ocument.getElementById('close').onclick=closeItem;document.getElementById('back').onclick=closeItem;document.getElementById('next').onclick=()=>openItem(ITEMS[(ITEMS.indexOf(item)+1)%ITEMS.length]);document.getElementById('close').focus();document.getElementById('hint').style.display='none';document.getElementById('introCaption').style.display='none';if(el&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,scaleX=Math.max(0.02,r.width/innerWidth),scaleY=Math.max(0.02,r.height/innerHeight);overlay.animate([{opacity:.75,clipPath:`inset(${Math.max(0,cy-r.height/2)}px ${Math.max(0,innerWidth-cx-r.width/2)}px ${Math.max(0,innerHeight-cy-r.height/2)}px ${Math.max(0,cx-r.width/2)}px round 10px)`},{opacity:1,clipPath:'inset(0px 0px 0px 0px round 0px)'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'})}}

function introFlight(){if(userMoved||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const stages=[{at:250,id:'start',s:2.05},{at:1700,id:'mission',s:1.32},{at:3100,id:'prevention',s:1.28},{at:4500,id:'youth',s:1.2},{at:5900,id:'contact',s:1.18}];
 stages.forEach(step=>introTimers.push(setTimeout(()=>{if(!userMoved){const i=ITEMS.find(a=>a.id===step.id);focusTile(i,step.s)}},step.at)));
 introTimers.push(setTimeout(()=>{if(!userMoved)fitAll()},7300));}
const _motionUserAction=()=>{userMoved=true;stopIntro()};
['pointerdown','wheel'].forEach(t=>vw.addEventListener(t,_motionUserAction,{passive:true,once:true}));
render();if(matchMedia('(prefers-reduced-motion: reduce)').matches){fitAll()}else{cam={x:0,y:0,s:2.7};render();introFlight()}
</script></body></html>
