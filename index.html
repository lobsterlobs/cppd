function openItem(item,el){userMoved=true;prevFocus=document.activeElement;opened=item;overlay.style.background=item.color;overlay.style.color=item.fg;article.innerHTML=`<div class="article-top"><div class="edition">ФОНДАЦИЯ ЦЕНТЪР ЗА ОБЩЕСТВЕНА ПРЕВЕНЦИЯ И РАЗВИТИЕ / ${item.n}</div><button class="close" id="close" aria-label="Затвори">×</button></div><div class="article-main"><div class="article-kicker">${item.tag}</div><h1 id="articleTitle">${item.title}</h1><div class="lead">${item.lead}</div><div class="bodycopy">${item.text.map(t=>'<p>'+t+'</p>').join('')}</div><div class="article-footer"><button id="back">← Към всички теми</button><button id="next">Следваща тема →</button></div></div>`;overlay.classList.add('open');overlay.scrollTop=0;if(item.id==='contact'){const main=article.querySelector('.article-main');const sec=document.createElement('section');sec.innerHTML=`<a class="contact-email" href="mailto:office@cppd.eu">office@cppd.eu ↗</a><form class="contact-form" id="contactForm"><label>Име <input name="name" autocomplete="name" required maxlength="120"></label><label>Имейл <input name="email" type="email" autocomplete="email" required maxlength="180"></label><label>Тема <input name="subject" required maxlength="160"></label><label>Съобщение <textarea name="message" required maxlength="5000"></textarea></label><button type="submit">Подготви съобщение ↗</button><p class="form-note">При натискане ще се отвори твоето приложение за имейл с попълнените данни. За изпращане директно от сайта е необходима сървърна услуга за контактната форма.</p></form>`;main.appendChild(sec);sec.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;const d=new FormData(f);const subject=String(d.get('subject'));const body=`Име: ${d.get('name')}\nИмейл: ${d.get('email')}\n\n${d.get('message')}`;window.location.href=`mailto:office@cppd.eu?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;});}document.getElementById('close').onclick=closeItem;document.getElementById('back').onclick=closeItem;document.getElementById('next').onclick=()=>openItem(ITEMS[(ITEMS.indexOf(item)+1)%ITEMS.length]);document.getElementById('close').focus();document.getElementById('hint').style.display='none';document.getElementById('introCaption').style.display='none';if(el&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,scaleX=Math.max(0.02,r.width/innerWidth),scaleY=Math.max(0.02,r.height/innerHeight);overlay.animate([{opacity:.75,clipPath:`inset(${Math.max(0,cy-r.height/2)}px ${Math.max(0,innerWidth-cx-r.width/2)}px ${Math.max(0,innerHeight-cy-r.height/2)}px ${Math.max(0,cx-r.width/2)}px round 10px)`},{opacity:1,clipPath:'inset(0px 0px 0px 0px round 0px)'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'})}}
function closeItem(){opened=null;overlay.classList.remove('open');document.getElementById('hint').style.display='';document.getElementById('introCaption').style.display='';prevFocus?.focus?.()}
function toggleIndex(show){panel.classList.toggle('open',show);indexBtn.setAttribute('aria-expanded',String(show))}indexBtn.onclick=()=>toggleIndex(!panel.classList.contains('open'));

function zoomAt(f,clientX,clientY){userMoved=true;const s=clamp(cam.s*f,.25,3.4),pX=clientX-innerWidth/2,pY=clientY-innerHeight/2;let wX=(pX-cam.x)/cam.s,wY=(pY-cam.y)/cam.s;motion({s,x:pX-wX*s,y:pY-wY*s},260)}
vw.addEventListener('wheel',e=>{if(overlay.classList.contains('open'))return;e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0012),e.clientX,e.clientY)},{passive:false});vw.addEventListener('pointerdown',e=>{if(e.target.closest('button')&&e.pointerType==='mouse')return;if(anim)cancelAnimationFrame(anim);drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};vw.setPointerCapture(e.pointerId)});vw.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7){drag.moved=true;userMoved=true}if(drag.moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy;render()}});vw.addEventListener('pointerup',()=>{setTimeout(()=>drag=null,30)});vw.addEventListener('pointercancel',()=>drag=null);
addEventListener('keydown',e=>{if(e.key==='Escape'){if(opened)closeItem();else toggleIndex(false)}if(opened){if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button,a,[tabindex]')].filter(n=>!n.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='+'||e.key==='=')zoomAt(1.2,innerWidth/2,innerHeight/2);if(e.key==='-')zoomAt(.8,innerWidth/2,innerHeight/2);if(e.key==='ArrowLeft'){cam.x+=65;render()}if(e.key==='ArrowRight'){cam.x-=65;render()}if(e.key==='ArrowUp'){cam.y+=65;render()}if(e.key==='ArrowDown'){cam.y-=65;render()}});
addEventListener('resize',()=>{if(!userMoved)fitAll()});
/* Cinematic guided flight on first visit: focus logo, pan over modules, reveal whole canvas. */
let introTimers=[];function stopIntro(){introTimers.forEach(clearTimeout);introTimers=[]}
function introFlight(){if(userMoved||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const stages=[{at:250,id:'start',s:2.05},{at:1700,id:'mission',s:1.32},{at:3100,id:'prevention',s:1.28},{at:4500,id:'youth',s:1.2},{at:5900,id:'contact',s:1.18}];
 stages.forEach(step=>introTimers.push(setTimeout(()=>{if(!userMoved){const i=ITEMS.find(a=>a.id===step.id);focusTile(i,step.s)}},step.at)));
 introTimers.push(setTimeout(()=>{if(!userMoved)fitAll()},7300));}
const _motionUserAction=()=>{userMoved=true;stopIntro()};
['pointerdown','wheel'].forEach(t=>vw.addEventListener(t,_motionUserAction,{passive:true,once:true}));
render();if(matchMedia('(prefers-reduced-motion: reduce)').matches){fitAll()}else{cam={x:0,y:0,s:2.7};render();introFlight()}
</script></body></html>
